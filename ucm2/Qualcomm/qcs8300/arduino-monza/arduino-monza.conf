Syntax 4

# Detect which codec HAT is installed by checking for its DAI-link-specific
# mixer control. When the JHAT WM8960 overlay is applied, the kernel registers
# the LPI MI2S_RX_1 dai-link and creates 'LPI_MI2S_RX_1 Audio Mixer MultiMedia6'.
# Without a HAT the board boots with the onboard max98090 via LPI_MI2S_RX_0.

If.wm8960 {
	Condition {
		Type ControlExists
		Control "name='LPI_MI2S_RX_1 Audio Mixer MultiMedia6'"
	}
	True {
		SectionUseCase."HiFi" {
			File "/Qualcomm/qcs8300/arduino-monza/HiFi-WM8960.conf"
			Comment "HiFi quality Music"
		}

		BootSequence [
			cset "name='Left Output Mixer PCM Playback Switch' on"
			cset "name='Right Output Mixer PCM Playback Switch' on"
			cset "name='ADC PCM Capture Volume' 195,195"
			cset "name='ADC Data Output Select' 'Left Data = Left ADC;  Right Data = Right ADC'"
		]
	}
	False {
		SectionUseCase."HiFi" {
			File "/Qualcomm/qcs8300/arduino-monza/HiFi.conf"
			Comment "HiFi quality Music"
		}

		BootSequence [
			cset "name='Headphone Volume' 30"
			cset "name='MIC1 Volume' 20"
		]
	}
}
