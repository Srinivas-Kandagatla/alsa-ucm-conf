# Use case configuration for Arduino Monza with WM8960 Audio HAT on JHAT connector.
# The WM8960 HAT connects via LPI I2S1 (LPASS GPIO 6-9: CLK/WS/DOUT/DIN).
#
# When the JHAT overlay is applied the sound card gains two new dai-links.
# With Q6APM grouping all playback PCMs before capture, the device layout
# on the extended card becomes:
#   device 0: MM1 - Analog Playback  (max98090, existing)
#   device 1: MM2 - HDMI Playback    (adv7535, existing)
#   device 2: MM3 - DP Playback      (existing)
#   device 3: MM6 - JHAT Playback    (WM8960 via LPI_MI2S_RX_1)
#   device 4: MM4 - Analog Capture   (max98090, shifted)
#   device 5: MM5 - JHAT Capture     (WM8960 via LPI_MI2S_TX_1)
#
# Author: Srinivas Kandagatla <srinivas.kandagatla@oss.qualcomm.com>

SectionVerb {
	EnableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='LPI_MI2S_RX_4 Audio Mixer MultiMedia2' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia4 Mixer LPI_MI2S_TX_0' 1"
		cset "name='LPI_MI2S_RX_1 Audio Mixer MultiMedia6' 1"
		cset "name='MultiMedia5 Mixer LPI_MI2S_TX_1' 1"
	]

	DisableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='LPI_MI2S_RX_4 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 0"
		cset "name='MultiMedia4 Mixer LPI_MI2S_TX_0' 0"
		cset "name='LPI_MI2S_RX_1 Audio Mixer MultiMedia6' 0"
		cset "name='MultiMedia5 Mixer LPI_MI2S_TX_1' 0"
	]

	Include.e.File "/codecs/max98090/EnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Line1" {
	Comment "Analog Line Output"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='Receiver Left Switch' on"
		cset "name='Receiver Right Switch' on"
		cset "name='Receiver Switch' on"
		cset "name='Left Receiver Mixer Left DAC Switch' 1"
		cset "name='Right Receiver Mixer Right DAC Switch' 1"
		cset "name='LINMOD Mux' 1"
		cset "name='Receiver Left Mixer Volume' 2"
		cset "name='Receiver Right Mixer Volume' 2"
		cset "name='Speaker Switch' off"
	]

	DisableSequence [
		cset "name='Receiver Left Switch' off"
		cset "name='Receiver Right Switch' off"
		cset "name='Receiver Switch' off"
	]
}

SectionDevice."Headphones" {
	Comment "Headphone Output"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}

	ConflictingDevice [
		"Line1"
		"Earpiece"
	]

	EnableSequence [
		cset "name='Headphone Left Switch' on"
		cset "name='Headphone Right Switch' on"
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Left Switch' off"
		cset "name='Headphone Right Switch' off"
		cset "name='Headphone Switch' off"
	]
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}

	ConflictingDevice [
		"Line1"
		"Headphones"
	]

	EnableSequence [
		cset "name='Speaker Left Switch' on"
		cset "name='Speaker Right Switch' on"
		cset "name='Speaker Switch' on"
		cset "name='Receiver Switch' off"
	]

	DisableSequence [
		cset "name='Speaker Left Switch' off"
		cset "name='Speaker Right Switch' off"
		cset "name='Speaker Switch' off"
	]
}

SectionDevice."HDMI1" {
	Comment "HDMI playback"

	Value {
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."HDMI2" {
	Comment "DisplayPort 0 playback"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
		JackControl "DP0 Jack"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	EnableSequence [
		cset "name='MIC1 Mux' IN12"
		cset "name='DMIC Mux' 0"
		cset "name='Headset Mic Switch' on"
		cset "name='Headset Mic12 Switch' on"
		cset "name='Record Path DC Blocking' on"
		cset "name='Left ADC Mixer MIC2 Switch' on"
		cset "name='Right ADC Mixer MIC2 Switch' on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='DMIC Mux' 1"
		cset "name='Record Path DC Blocking' off"
		cset "name='Headset Mic12 Switch' off"
		cset "name='Left ADC Mixer MIC2 Switch' off"
		cset "name='Right ADC Mixer MIC2 Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},4"
	}
}

SectionDevice."JHAT Headphones" {
	Comment "JHAT WM8960 Headphone Output"

	ConflictingDevice [
		"JHAT Speaker"
	]

	Include.wm8960hpe.File "/codecs/wm8960/HeadphoneEnableSeq.conf"
	Include.wm8960hpd.File "/codecs/wm8960/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},3"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
}

SectionDevice."JHAT Speaker" {
	Comment "JHAT WM8960 Speaker Output"

	ConflictingDevice [
		"JHAT Headphones"
	]

	Include.wm8960spke.File "/codecs/wm8960/SpeakerEnableSeq.conf"
	Include.wm8960spkd.File "/codecs/wm8960/SpeakerDisableSeq.conf"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},3"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."JHAT Mic" {
	Comment "JHAT WM8960 Microphone (INPUT1)"

	Include.wm8960mice.File "/codecs/wm8960/MicIN1EnableSeq.conf"
	Include.wm8960micd.File "/codecs/wm8960/MicIN1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},5"
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "Capture"
	}
}
