# Use case configuration for Lenovo ThinkPad T14s Gen 7 (Mahua).
# 2x WSA8845 speakers on swr0 + 2x DMICs via VA macro; WCD headphone
# jack (playback + mic); two USB-C DisplayPort outputs (DP0/DP1) and
# one on-board HDMI (DP2 via Realtek RTD2171A DP-to-HDMI bridge).
#
# PCM layout (one MultiMedia FE per backend):
#   hw:,0  MM1 -> WSA_CODEC_DMA_RX_0   Speaker
#   hw:,1  MM2 <- VA_CODEC_DMA_TX_0    DMIC capture
#   hw:,2  MM3 -> DISPLAY_PORT_RX_0    DP0
#   hw:,3  MM4 -> DISPLAY_PORT_RX_1    DP1
#   hw:,4  MM5 -> RX_CODEC_DMA_RX_0    Headphones
#   hw:,5  MM6 -> TX_CODEC_DMA_TX_3    Headset mic
#
# TODO (present in HW, not yet wired in topology/UCM):
#   HDMI2 - on-board HDMI (DISPLAY_PORT_RX_2 via RTD2171A)

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia5' 1"
		cset "name='MultiMedia6 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

	# Speaker Protection: V/I sense + VI feedback mixer taps on the
	# single WSA bus. DSP cal is a separate userspace step (sp-calib);
	# UCM only wires the routing. No-ops on kernels without the SP
	# series.
	Include.wsasp.File  "/codecs/wsa884x/two-speakers/SpeakerProtectionEnableSeq.conf"
	Include.wsm1vi.File "/codecs/qcom-lpass/wsa-macro/Wsa1VISenseEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"
	Include.wsaspk.File "/codecs/wsa884x/two-speakers/SpeakerSeq.conf"
	Include.wsaspd.File "/codecs/wsa884x/two-speakers/SpeakerProtectionDisableSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	EnableSequence [
		# LPASS RX macro path
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0_1 INTERP' 'RX INT0_1 MIX1'"
		cset "name='RX INT1_1 INTERP' 'RX INT1_1 MIX1'"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 1"
		cset "name='RX_COMP2 Switch' 1"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"

		# SDCA codec: Function Unit 6 (HP amp) + SU/OT for L/R
		cset "name='FU 6 Channel Switch' 1"
		cset "name='FU 6 Channel Volume' 0"
		cset "name='OT 43 Switch' 1"
		cset "name='OT 45 Switch' 1"
	]

	DisableSequence [
		cset "name='OT 43 Switch' 0"
		cset "name='OT 45 Switch' 0"
		cset "name='FU 6 Channel Switch' 0"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},4"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "FU 6 Channel"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	EnableSequence [
		# LPASS TX macro path (SDCA soundwire mic on SWR_MIC0)
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"

		# SDCA codec: mic selector unit
		cset "name='SU 35' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},5"
		CaptureMixerElem "TX_DEC0"
	}
}

SectionDevice."HDMI0" {
	Comment "USB-C DisplayPort 0 playback"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		JackControl "DP0 Jack"
	}
}

SectionDevice."HDMI1" {
	Comment "USB-C DisplayPort 1 playback"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},3"
		JackControl "DP1 Jack"
	}
}
